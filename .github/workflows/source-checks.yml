name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 libc++-18-dev libc++abi-18-dev python3 nodejs
      - name: Configure without game assets
        run: |
          cmake -S . -B build/checks -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DPS2_RUNTIME_TESTS=ON -DPS2_DEVELOPER_TOOLS=OFF
      - name: Build source fixtures and tools
        run: cmake --build build/checks --parallel 2
      - name: Run native regression checks
        run: ctest --test-dir build/checks --output-on-failure
      - name: Check browser JavaScript regressions
        run: |
          node scripts/test_disc_fetch.cjs
          node scripts/test_frame_presentation.cjs
          node scripts/test_queue_submit.cjs
          node scripts/test_frame_metrics.cjs
          node scripts/test_audio_metrics.cjs
          node scripts/test_audio_refill.cjs
          node scripts/test_queue_wait.cjs
          node scripts/test_yield_tasks.cjs
          node scripts/test_gpu_probe.cjs
          node scripts/test_staged_uploads.cjs
          node scripts/test_input_resume.cjs
          node scripts/test_startup_audio.cjs
          node scripts/test_display_capacity.cjs
          node scripts/test_sync_game_workers.cjs
          node scripts/test_worker_runtime_bridge.cjs
          node scripts/test_game_worker_client.cjs

  wasm-vu-jit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git tools/emsdk
          tools/emsdk/emsdk install 6.0.11
          tools/emsdk/emsdk activate 6.0.11
      - name: Compile and execute an unseen VU program on host and worker
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_vu_jit_web.py
      - name: Check synchronous worker exports and main-thread suspension
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_sync_game_workers.py
      - name: Check exact SIMD movie pixels
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_ipu_color.py
      - name: Check exact SIMD inverse movie transforms
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_ipu_idct.py
      - name: Check coefficient look-ahead and exact refill behavior
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_ipu_coefficients.py
      - name: Check exact SIMD movie bit look-ahead
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_ipu_bits.py
      - name: Check movie FIFO decoding and state continuity in Wasm
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_ipu_streaming_web.py
      - name: Check producer-to-renderer notification with older wake paths withheld
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_render_queue_web.py
      - name: Check rendering runtime event-loop availability
        run: |
          source tools/emsdk/emsdk_env.sh
          python3 scripts/test_renderer_runtime_wait.py
