name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 libc++-18-dev libc++abi-18-dev python3 nodejs
      - name: Configure without game assets
        run: |
          cmake -S . -B build/checks -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DPS2_RUNTIME_TESTS=ON -DPS2_DEVELOPER_TOOLS=OFF
      - name: Build source fixtures and tools
        run: cmake --build build/checks --parallel 2
      - name: Run native regression checks
        run: ctest --test-dir build/checks --output-on-failure
      - name: Check JavaScript disc fetching and presentation
        run: |
          node scripts/test_disc_fetch.cjs
          node scripts/test_frame_presentation.cjs
