<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>GS backend verification</title>
<canvas id="canvas" width="128" height="512"></canvas>
<pre id="log">GS backend fixture loading…
</pre>
<script src="ordered_raster.js"></script>
<script>
const fixture = new URLSearchParams(location.search).get('fixture') || 'restore';
if (!['population', 'readback', 'restore', 'export'].includes(fixture)) throw Error('Unknown fixture');
var Module = {
  canvas: document.getElementById('canvas'),
  orderedRasterEnabled: new URLSearchParams(location.search).has('ordered'),
  preRun: [function () {
    if (!Module.orderedRasterEnabled) return;
    Module.addRunDependency('kernel');
    fetch('kernel.frag').then(response => {if (!response.ok) throw Error('Kernel unavailable'); return response.text();})
      .then(source => {Module.orderedKernelSource = source; Module.removeRunDependency('kernel');})
      .catch(error => {window.fixtureResult = {error: error.message}; console.error(error);});
  }],
  print: text => { document.getElementById('log').textContent += text + '\n'; },
  printErr: text => console.error(text)
};
const script = document.createElement('script');
script.src = fixture + '.js';
script.onerror = () => { window.fixtureResult = {error: 'Fixture module failed to load'}; };
document.body.append(script);
</script>
